[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = ["daphne>=4.2.3", "ruff>=0.17.4"]


[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
